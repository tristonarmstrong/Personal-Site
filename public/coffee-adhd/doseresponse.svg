<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" role="img" aria-label="Illustrative sketch of an inverted-U curve: too little caffeine leaves you sluggish, a middle range feels best, too much brings jitters and anxiety">
  <style>
    .lbl { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; fill: #3a3226; }
    .small { font-family: Georgia, 'Times New Roman', serif; font-size: 13.5px; fill: #6b5d45; }
    .tiny { font-family: Georgia, 'Times New Roman', serif; font-size: 12px; fill: #6b5d45; font-style: italic; }
    .axis { stroke: #3a3226; stroke-width: 2; stroke-linecap: round; }
    .curve { stroke: #b4552d; stroke-width: 3.5; fill: none; stroke-linecap: round; }
  </style>

  <text x="310" y="30" text-anchor="middle" class="lbl">More is not always better</text>

  <!-- axes (no numbers: this is conceptual) -->
  <line x1="80" y1="290" x2="580" y2="290" class="axis"/>
  <polygon points="584,290 574,285 574,295" fill="#3a3226"/>
  <text x="330" y="322" text-anchor="middle" class="small">caffeine dose</text>
  <line x1="80" y1="290" x2="80" y2="70" class="axis"/>
  <polygon points="80,66 75,76 85,76" fill="#3a3226"/>
  <text x="40" y="180" text-anchor="middle" class="small" transform="rotate(-90 40 180)">how it feels</text>

  <!-- inverted-U curve -->
  <path d="M90,260 C180,250 230,120 320,105 C410,92 470,170 560,230" class="curve"/>

  <!-- zones -->
  <text x="150" y="250" text-anchor="middle" class="small">sluggish,</text>
  <text x="150" y="268" text-anchor="middle" class="small">unfocused</text>
  <text x="320" y="80" text-anchor="middle" class="lbl">sweet spot</text>
  <line x1="320" y1="88" x2="320" y2="102" stroke="#3a3226" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="490" y="200" text-anchor="middle" class="small">jittery, anxious,</text>
  <text x="490" y="218" text-anchor="middle" class="small">wired</text>
  <text x="520" y="262" text-anchor="middle" class="tiny">and the sleep cost</text>
  <text x="520" y="278" text-anchor="middle" class="tiny">keeps climbing</text>

  <text x="310" y="352" text-anchor="middle" class="tiny">Illustrative sketch, not measured clinical data. Everyone's curve sits somewhere different.</text>
</svg>
