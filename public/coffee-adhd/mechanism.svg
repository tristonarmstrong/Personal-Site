<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" role="img" aria-label="Diagram: caffeine blocks adenosine receptors, which indirectly affects other neurotransmitters">
  <style>
    .ink { fill: #3a3226; }
    .soft { fill: #6b5d45; }
    .accent { fill: #b4552d; }
    .lbl { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; fill: #3a3226; }
    .small { font-family: Georgia, 'Times New Roman', serif; font-size: 13.5px; fill: #6b5d45; }
    .tiny { font-family: Georgia, 'Times New Roman', serif; font-size: 12px; fill: #6b5d45; font-style: italic; }
    .line { stroke: #3a3226; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: #3a3226; stroke-width: 2; fill: none; stroke-linecap: round; }
  </style>

  <!-- Panel 1 -->
  <text x="110" y="34" text-anchor="middle" class="lbl">1. Adenosine docks</text>
  <text x="110" y="100" text-anchor="middle" class="small">adenosine</text>
  <circle cx="110" cy="140" r="20" fill="#f3ecdc" stroke="#3a3226" stroke-width="3"/>
  <line x1="110" y1="164" x2="110" y2="192" class="thin"/>
  <polygon points="110,196 104,186 116,186" class="ink"/>
  <path d="M70,204 L70,232 Q70,252 90,252 L130,252 Q150,252 150,232 L150,204" class="line"/>
  <text x="110" y="272" text-anchor="middle" class="small">receptor</text>
  <line x1="110" y1="286" x2="110" y2="312" class="thin"/>
  <polygon points="110,316 104,306 116,306" class="ink"/>
  <text x="110" y="336" text-anchor="middle" class="small">sleepiness signal: on</text>

  <!-- arrow 1->2 -->
  <line x1="186" y1="180" x2="216" y2="180" class="thin"/>
  <polygon points="220,180 211,174 211,186" class="ink"/>

  <!-- Panel 2 -->
  <text x="310" y="34" text-anchor="middle" class="lbl">2. Caffeine cuts in</text>
  <text x="310" y="100" text-anchor="middle" class="small">caffeine</text>
  <polygon points="310,122 326,131 326,149 310,158 294,149 294,131" fill="#f0c9a8" stroke="#3a3226" stroke-width="3" stroke-linejoin="round"/>
  <path d="M270,204 L270,232 Q270,252 290,252 L330,252 Q350,252 350,232 L350,204" class="line"/>
  <text x="310" y="272" text-anchor="middle" class="small">receptor</text>
  <!-- deflected adenosine -->
  <path d="M352,150 Q380,140 402,152" class="thin"/>
  <polygon points="406,154 396,149 397,160" class="ink"/>
  <circle cx="424" cy="156" r="14" fill="#f3ecdc" stroke="#3a3226" stroke-width="2.5"/>
  <text x="452" y="150" class="tiny">adenosine,</text>
  <text x="452" y="166" class="tiny">turned away</text>
  <!-- blocked signal -->
  <line x1="310" y1="286" x2="310" y2="312" class="thin" stroke-dasharray="5,4"/>
  <text x="310" y="336" text-anchor="middle" class="small">sleepiness signal: off</text>

  <!-- arrow 2->3 -->
  <line x1="486" y1="180" x2="500" y2="180" class="thin"/>
  <polygon points="504,180 495,174 495,186" class="ink"/>

  <!-- Panel 3 -->
  <text x="556" y="34" text-anchor="middle" class="lbl">3. Downstream</text>
  <text x="512" y="110" class="small">norepinephrine</text>
  <text x="512" y="140" class="small">dopamine</text>
  <text x="512" y="170" class="small">acetylcholine</text>
  <text x="512" y="200" class="small">serotonin</text>
  <text x="512" y="230" class="small">glutamate</text>
  <text x="512" y="260" class="small">GABA</text>
  <line x1="500" y1="104" x2="500" y2="254" class="thin" opacity="0.4"/>
  <text x="556" y="300" text-anchor="middle" class="tiny">indirectly nudged,</text>
  <text x="556" y="318" text-anchor="middle" class="tiny">not directly hit</text>
</svg>
